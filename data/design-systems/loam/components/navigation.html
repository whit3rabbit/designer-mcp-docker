<!-- @dsCard group="Components" name="Navigation" subtitle="The header bar with the wordmark lockup" viewport="640x360" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loam — Navigation</title>
<link rel="stylesheet" href="../styles.css" />
<style>
/* Demo scaffolding only — everything visual comes from ../styles.css. */
.demo { max-width: 620px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
.demo-head {
  font-family: var(--font-body); font-size: 11px; font-weight: inherit;
  letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;
  margin: var(--space-6) 0 var(--space-3);
}
.demo-head:first-child { margin-top: 0; }
.nav-demo { border: 1px solid var(--color-divider); border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--space-4); }
.nav { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); background: var(--color-bg); }
.nav-links { display: flex; gap: var(--space-4); font-size: 13px; }
.nav-links a { color: var(--color-neutral-600); text-decoration: none; }
.nav-links a[aria-current] { color: var(--color-accent-2); font-weight: 600; }
.dark-nav { background: var(--color-neutral-900); }
.dark-nav .nav-links a { color: color-mix(in srgb, #ffffff 60%, transparent); }
.dark-nav .nav-links a[aria-current] { color: #ffffff; }
.note { font-size: 12px; opacity: 0.6; max-width: 60ch; }
</style>
</head>
<body>
<main class="demo">
<div class="demo-head">Light bar</div>
  <div class="nav-demo">
    <div class="nav">
      <a class="wordmark" href="#">loam<i></i></a>
      <div class="nav-links"><a href="#" aria-current="page">Work</a><a href="#">Services</a><a href="#">Contact</a></div>
    </div>
  </div>
<div class="demo-head">Dark bar</div>
  <div class="nav-demo dark-nav">
    <div class="nav on-dark">
      <a class="wordmark" href="#">loam<i></i></a>
      <div class="nav-links"><a href="#" aria-current="page">Work</a><a href="#">Services</a><a href="#">Contact</a></div>
    </div>
  </div>
  <p class="note">The brand is the wordmark lockup: lowercase, bold, accent period. The slash element rides once, at the lockup's shoulder. Links stay quiet until current.</p>
</main>
</body>
</html>
