<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{BRAND_NAME}} — Monthly Digest</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F5F6FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#2F2B3D;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background-color:#FFFFFF;border:1px solid #E4E3EC;border-radius:10px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px;border-bottom:1px solid #E4E3EC;">
                <strong style="font-size:18px;color:{{PRIMARY_COLOR}};">{{BRAND_NAME}}</strong>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px;font-size:20px;">Your monthly metrics digest</h1>
                <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#5E5A6F;">
                  Here is a summary of your workspace performance, top-growing cohorts, and system uptime for this period.
                </p>
                <a href="{{APP_URL}}" style="display:inline-block;padding:12px 24px;background-color:{{PRIMARY_COLOR}};color:#FFFFFF;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600;">
                  Open Dashboard
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
