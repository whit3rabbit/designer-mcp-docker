<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your email</title></head>
<body style="margin:0;padding:24px;background:#F5F6FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#2F2B3D;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #E4E3EC;border-radius:10px;">
    <tr><td style="padding:32px;">
      <p style="margin:0 0 16px;font-size:18px;font-weight:700;color:{{PRIMARY_COLOR}};">{{BRAND_NAME}}</p>
      <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;">Confirm your email address</h1>
      <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#5E5A6F;">Click below to verify your email address. This verification link expires in 24 hours.</p>
      <a href="{{VERIFY_URL}}" style="display:inline-block;padding:12px 22px;background:{{PRIMARY_COLOR}};color:#FFFFFF;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600;">Verify Email</a>
    </td></tr>
  </table>
</body>
</html>
