<div class="space-y-4">
  <!-- Variants (solid, tonal, outline, ghost, link) -->
  <div class="flex flex-wrap items-center gap-2">
    <button type="button" class="inline-flex h-[38px] cursor-pointer items-center px-4 text-sm font-medium" style="background-color: var(--color-primary); color: var(--color-on-solid); border-radius: var(--radius-md);">Solid</button>
    <button type="button" class="inline-flex h-[38px] cursor-pointer items-center px-4 text-sm font-medium" style="background-color: var(--color-primary-surface); color: var(--color-primary); border-radius: var(--radius-md);">Tonal</button>
    <button type="button" class="inline-flex h-[38px] cursor-pointer items-center border px-4 text-sm font-medium" style="border-color: var(--color-primary-border); color: var(--color-primary); border-radius: var(--radius-md);">Outline</button>
    <button type="button" class="inline-flex h-[38px] cursor-pointer items-center px-4 text-sm font-medium" style="color: var(--color-primary); border-radius: var(--radius-md);">Ghost</button>
    <button type="button" class="inline-flex h-[38px] cursor-pointer items-center px-2 text-sm font-medium underline-offset-4 hover:underline" style="color: var(--color-primary);">Link</button>
  </div>

  <!-- Semantic Tones -->
  <div class="flex flex-wrap items-center gap-2">
    <button type="button" class="inline-flex h-8 cursor-pointer items-center px-3 text-xs font-medium" style="background-color: var(--color-secondary); color: var(--color-on-solid); border-radius: var(--radius-md);">Secondary</button>
    <button type="button" class="inline-flex h-8 cursor-pointer items-center px-3 text-xs font-medium" style="background-color: var(--color-success); color: var(--color-on-solid); border-radius: var(--radius-md);">Success</button>
    <button type="button" class="inline-flex h-8 cursor-pointer items-center px-3 text-xs font-medium" style="background-color: var(--color-info); color: var(--color-on-solid); border-radius: var(--radius-md);">Info</button>
    <button type="button" class="inline-flex h-8 cursor-pointer items-center px-3 text-xs font-medium" style="background-color: var(--color-warning); color: var(--color-on-solid); border-radius: var(--radius-md);">Warning</button>
    <button type="button" class="inline-flex h-8 cursor-pointer items-center px-3 text-xs font-medium" style="background-color: var(--color-error); color: var(--color-on-solid); border-radius: var(--radius-md);">Error</button>
  </div>

  <!-- Sizes (xs, sm, md, lg, xl) + States (iconOnly, loading, disabled) -->
  <div class="flex flex-wrap items-center gap-2">
    <button type="button" class="inline-flex h-7 cursor-pointer items-center px-2 text-xs font-medium" style="background-color: var(--color-primary); color: var(--color-on-solid); border-radius: var(--radius-md);">XS</button>
    <button type="button" class="inline-flex h-8 cursor-pointer items-center px-3 text-xs font-medium" style="background-color: var(--color-primary); color: var(--color-on-solid); border-radius: var(--radius-md);">SM</button>
    <button type="button" class="inline-flex h-[38px] cursor-pointer items-center px-4 text-sm font-medium" style="background-color: var(--color-primary); color: var(--color-on-solid); border-radius: var(--radius-md);">MD</button>
    <button type="button" class="inline-flex h-11 cursor-pointer items-center px-5 text-sm font-medium" style="background-color: var(--color-primary); color: var(--color-on-solid); border-radius: var(--radius-md);">LG</button>
    <button type="button" class="inline-flex h-12 cursor-pointer items-center px-6 text-base font-medium" style="background-color: var(--color-primary); color: var(--color-on-solid); border-radius: var(--radius-md);">XL</button>
    <button type="button" aria-label="Add item" class="inline-flex size-[38px] cursor-pointer items-center justify-center p-0" style="background-color: var(--color-primary-surface); color: var(--color-primary); border-radius: var(--radius-md);">+</button>
    <button type="button" disabled aria-busy="true" class="inline-flex h-[38px] items-center gap-2 px-4 text-sm font-medium opacity-55" style="background-color: var(--color-primary); color: var(--color-on-solid); border-radius: var(--radius-md);">Loading...</button>
  </div>
</div>
