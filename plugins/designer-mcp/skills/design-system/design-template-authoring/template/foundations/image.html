<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>__NAME__ — Image</title>
<link rel="stylesheet" href="../styles.css" />
<style>
/* Demo scaffolding only — everything visual comes from ../styles.css. */
.demo { max-width: 620px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
.demo-head {
  font-family: var(--font-body); font-size: 11px; font-weight: inherit;
  letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;
  margin: var(--space-6) 0 var(--space-3);
}
.demo-head:first-child { margin-top: 0; }
.row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.note { font-size: 12px; opacity: 0.6; max-width: 60ch; }
.demo img { width: 100%; height: 150px; object-fit: cover; }
.demo .pill img, .demo .arch img { height: 170px; }
.demo .pill, .demo .arch { width: 128px; }
</style>
</head>
<body>
<main class="demo">
<div class="demo-head">Straight, framed</div>
  <figure class="frame"><img src="../assets/photo.jpg" alt="The reference photograph, framed"></figure>
  <figcaption>TODO: the treatment rule in one line.</figcaption>
<div class="demo-head">Masks</div>
  <div class="row">
    <figure class="pill"><img src="../assets/photo.jpg" alt="Pill mask"></figure>
    <figure class="arch"><img src="../assets/photo.jpg" alt="Arch mask"></figure>
    <figure class="frame"><img src="../assets/photo.jpg" alt="Framed"></figure>
  </div>
  <div class="demo-head">Rules</div>
  <p class="note">TODO: the imagery rules (color or treatment, masks, what the deck and landing mount with).</p>
</main>
</body>
