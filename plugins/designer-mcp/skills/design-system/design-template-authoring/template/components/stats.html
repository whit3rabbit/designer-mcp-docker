<!-- @dsCard group="Components" name="Stats" subtitle="Stat callouts and progress bars" viewport="640x420" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__NAME__ — Stats</title>
<link rel="stylesheet" href="../styles.css" />
<style>
/* Demo scaffolding only — everything visual comes from ../styles.css. */
.demo { max-width: 620px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
.demo-head {
  font-family: var(--font-body); font-size: 11px; font-weight: inherit;
  letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;
  margin: var(--space-6) 0 var(--space-3);
}
.demo-head:first-child { margin-top: 0; }
.stats { display: flex; gap: var(--space-8); }
.skill { margin-bottom: var(--space-6); }
.skill-row { display: flex; align-items: baseline; justify-content: space-between; }
.skill-name { font-weight: var(--font-heading-weight); font-size: 14px; }
.skill-pct { font-weight: var(--font-heading-weight); font-size: 14px; color: var(--color-accent); }
.note { font-size: 12px; opacity: 0.6; max-width: 60ch; }
</style>
</head>
<body>
<main class="demo">
<div class="demo-head">Stat pair</div>
  <div class="stats">
    <div><div class="stat-num">TODO</div><div class="stat-label">TODO</div></div>
    <div><div class="stat-num ink">TODO</div><div class="stat-label">TODO</div></div>
  </div>
  <p class="note">TODO: how many stats per slide, and the hairline-plus-caption pattern if used.</p>
<div class="demo-head">Skill bars</div>
  <div class="skill">
    <div class="skill-row"><span class="skill-name">TODO: label</span><span class="skill-pct">80%</span></div>
    <div class="bar-track" style="margin-top: var(--space-2);"><div class="bar-fill" style="width: 80%"></div></div>
  </div>
  <p class="note">TODO: the bar treatment rule.</p>
</main>
</body>
</html>
