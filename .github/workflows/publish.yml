name: publish

# Publish the image to GHCR. The workflow's GITHUB_TOKEN carries
# `packages: write` automatically, so no registry secret is needed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (blank = latest only)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: designer-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The image ships a baked catalog, so the build needs one. The bake
      # directory is a build artifact and is not in git, so it is produced
      # here from the fetchers — the same ones the image ships.
      #
      # The cache is restored between runs and the fetchers skip what is
      # already present, so this is fast after the first run.
      - name: Restore the catalog cache
        uses: actions/cache@v4
        with:
          path: ~/.design-cache
          key: catalog-${{ runner.os }}-${{ hashFiles('scripts/refero-public-fetch.js', 'scripts/fetch-opendesign.mjs', 'scripts/fetch-gradientdeck.mjs', 'scripts/fetch-presets.mjs', 'scripts/fetch-thumbs.mjs') }}
          restore-keys: |
            catalog-${{ runner.os }}-

      - name: Populate and bake the catalog
        run: |
          npm ci --omit=dev --ignore-scripts
          export DESIGN_CACHE_DIR="$HOME/.design-cache"
          export REFERO_CACHE_DIR="$HOME/.design-cache"
          node scripts/refero-public-fetch.js --limit 0 || echo "refero fetch incomplete"
          node scripts/fetch-opendesign.mjs || echo "opendesign import incomplete"
          node scripts/fetch-gradientdeck.mjs || echo "component fetch incomplete"
          node scripts/fetch-presets.mjs || echo "preset fetch incomplete"
          node scripts/fetch-thumbs.mjs --compress || echo "thumb fetch incomplete"
          node scripts/bake-cache.mjs --cache "$HOME/.design-cache" --out bake
          ls -la bake/

      - name: Verify offline browser previews
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm ci --prefix frontend/deck --ignore-scripts
          ./frontend/node_modules/.bin/playwright install --with-deps chromium
          npm run frontend:fetch-tailwind
          npm run frontend:build
          npm run frontend:test

      - name: Derive tags
        id: meta
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=designer-mcp
            org.opencontainers.image.description=Containerised Refero design-styles MCP server with a live preview gallery
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          docker pull "${IMAGE}:latest"
          # The baked catalog must be present and served with NO network at
          # all. This is the property the image exists for, so it is worth
          # failing the publish over.
          #
          # The container runs its normal CMD (the gallery); the checks are
          # exec'd inside it, because passing a command would replace the
          # CMD and the server would never start.
          docker rm -f designer-mcp-verify || true
          docker run -d --name designer-mcp-verify --network none "${IMAGE}:latest"
          trap 'docker rm -f designer-mcp-verify >/dev/null' EXIT
          sleep 12
          docker exec designer-mcp-verify node -e "
            const base = 'http://127.0.0.1:8787';
            const checks = ['/healthz', '/components', '/presets', '/api/designs'];
            let bad = 0;
            for (const p of checks) {
              try {
                const r = await fetch(base + p);
                const body = await r.text();
                const good = r.status === 200 && body.length > 0;
                console.log('  ' + (good ? 'ok  ' : 'FAIL') + ' ' + p + ' ' + r.status + ' ' + body.length + 'b');
                if (!good) bad++;
              } catch (e) {
                console.log('  FAIL ' + p + ' ' + e.message);
                bad++;
              }
            }
            if (bad) { console.error('published image is missing data'); process.exit(1); }
            console.log('published image serves the baked catalog offline');
          "
          docker exec designer-mcp-verify node scripts/verify-frontend-http.mjs
          echo "published: ${IMAGE}"
