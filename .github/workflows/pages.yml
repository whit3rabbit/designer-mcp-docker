# Publish the static site to GitHub Pages.
#
# This is a browsable preview of the Docker gallery and nothing more. The MCP
# servers are stdio processes that run from the Docker image on a local
# machine, so they are not hosted here. An agent can still read the site's
# catalog JSON remotely: point DESIGN_REMOTE_URL at the Pages URL.
#
# One-time setup: repo Settings, Pages, Source: GitHub Actions.
name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [publish]
    types: [completed]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The static build pulls ghcr.io/...:latest, so a tag release must win
    # the race: wait for publish to finish before rebuilding Pages, or the
    # site ships the previous release's bake and skill zip. The push trigger
    # above covers doc and script changes that never touch the image.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the static site from the baked image
        run: |
          # The pulled image bakes the catalog (/cache) and the built
          # frontend (/app/frontend-cache); the checked-out scripts override
          # the image's copies so Pages always builds with the current
          # builder, not whatever the last published image shipped.
          docker run --rm --network none \
            -v "$PWD/public:/out" \
            -v "$PWD/scripts:/app/scripts:ro" \
            ghcr.io/whit3rabbit/designer-mcp:latest \
            node /app/scripts/build-static.mjs --out /out

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
