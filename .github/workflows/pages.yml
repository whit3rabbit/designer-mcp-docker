# Publish the static site to GitHub Pages.
#
# This is a browsable preview of the Docker gallery and nothing more. The MCP
# servers are stdio processes that run from the Docker image on a local
# machine, so they are not hosted here. An agent can still read the site's
# catalog JSON remotely: point DESIGN_REMOTE_URL at the Pages URL.
#
# One-time setup: repo Settings, Pages, Source: GitHub Actions.
name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [publish]
    types: [completed]

permissions:
  pages: write
  id-token: write
  contents: read
  # Deleting an earlier attempt's artifact needs actions: write.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The static build pulls ghcr.io/...:latest, so a tag release must win
    # the race: wait for publish to finish before rebuilding Pages, or the
    # site ships the previous release's bake and skill zip. The push trigger
    # above covers doc and script changes that never touch the image.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Drop any artifact left by an earlier attempt
        # A re-run of this job keeps the run's old artifacts. deploy-pages
        # refuses to choose between two named github-pages, so clear the
        # slate before this attempt uploads its own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - uses: actions/checkout@v7

      - name: Build the static site from the baked image
        run: |
          # The pulled image bakes the catalog (/cache) and the built
          # frontend (/app/frontend-cache); the checked-out scripts override
          # the image's copies so Pages always builds with the current
          # builder, not whatever the last published image shipped.
          docker run --rm --network none \
            -v "$PWD/public:/out" \
            -v "$PWD/scripts:/app/scripts:ro" \
            ghcr.io/whit3rabbit/designer-mcp:latest \
            node /app/scripts/build-static.mjs --out /out

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Wait for the artifact to be listed
        # The artifact API can lag the upload by a second or two, and
        # deploy-pages fails the run when it sees zero. Poll briefly so the
        # lag never reaches the deploy step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 10); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" = "1" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::github-pages artifact still not visible after 30s"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
