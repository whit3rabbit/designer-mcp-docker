# designer-mcp — Refero styles gallery + MCP server.
#
# Two surfaces over one local cache:
#   gallery — HTTP preview with live thumbnails, colour swatches, type scales
#   mcp     — the stdio MCP server (7 tools) for agents
#
# The cache is populated OUTSIDE the container by scripts/refero-public-fetch.js,
# which reads only public pages. It is mounted read-only and never baked into
# the image.
#
#   docker compose pull              # fetch the published image
#   docker compose up -d gallery     # start the preview server
#   docker compose run --rm mcp      # run the stdio MCP server
#
# Point at a cache elsewhere with:
#   REFERO_CACHE_DIR=/path/to/cache docker compose up -d gallery
#
# Build from source instead of pulling:
#   docker compose build

x-image: &image
  # The published image, so a fresh clone can `docker compose pull` and run
  # without building. `docker compose build` still rebuilds it locally from
  # the Dockerfile in this repo.
  #
  # `:latest` tracks the newest release — the publish workflow pushes it
  # alongside every version tag. Pin to a specific tag (v1.0.4) for a
  # reproducible deployment.
  image: ghcr.io/whit3rabbit/designer-mcp:latest
  build:
    context: .

services:
  gallery:
    <<: *image
    ports:
      # Host port is configurable so a second instance can run alongside:
      #   GALLERY_PORT=8788 docker compose up -d gallery
      - "127.0.0.1:${GALLERY_PORT:-8787}:8787"
    volumes:
      - ${REFERO_CACHE_DIR:-./cache}:/cache:ro
    environment:
      REFERO_CACHE_DIR: /cache
      REFERO_CACHE_TTL_MS: "86400000"
      PORT: "8787"
      HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Populate the cache. The image ships the fetcher, so a fresh install needs
  # no repo checkout:
  #   docker compose run --rm fetch
  # Reads only public pages; /api/ is never requested.
  fetch:
    <<: *image
    profiles: ["fetch"]
    volumes:
      - ${REFERO_CACHE_DIR:-./cache}:/cache
    environment:
      REFERO_CACHE_DIR: /cache
    command: ["node", "scripts/refero-public-fetch.js", "--limit", "0"]

  # The stdio MCP server. Run it with `docker compose run --rm mcp` — it
  # speaks JSON-RPC over stdin/stdout, so it is not started by `up`.
  mcp:
    <<: *image
    profiles: ["mcp"]
    volumes:
      - ${REFERO_CACHE_DIR:-./cache}:/cache:ro
    environment:
      REFERO_CACHE_DIR: /cache
      REFERO_CACHE_TTL_MS: "86400000"
    command: ["node", "scripts/mcp-entry.mjs"]
    # stdout is the MCP transport — diagnostics go to stderr.
    init: true
