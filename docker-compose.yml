# designer-mcp — design-system catalog: gallery + MCP servers.
#
# Surfaces over one local cache:
#   gallery   — HTTP preview with local thumbnails, colour swatches, type scales
#   mcp       — the upstream Refero MCP server (7 `refero_*` tools)
#   design    — the generic MCP server (10 `design_*` tools, all sources)
#   fetch     — populates the cache from public sources
#   thumbs    — caches screenshots locally so the gallery works offline
#   opendesign — imports OpenDesign design systems
#   components — fetches the GradientDeck AI component catalog
#   presets   — fetches the GradientDeck gradient/pattern preset catalogs
#
# The image SHIPS a baked catalog, so `docker compose up gallery` works with
# no setup at all. The cache volume is mounted read-only on top of it: if it
# is empty the baked catalog is used, and if you populate it (with the
# services above) your data takes precedence.
#
#   docker compose pull                 # fetch the published image
#   docker compose up -d gallery        # start the preview server
#   docker compose run --rm fetch       # refresh Refero styles
#   docker compose run --rm opendesign  # refresh OpenDesign design systems
#   docker compose run --rm components  # refresh the AI component catalog
#   docker compose run --rm presets     # refresh the preset catalogs
#   docker compose run --rm mcp         # upstream Refero MCP server
#   docker compose run --rm design      # generic MCP server
#
# Point at a cache elsewhere with:
#   DESIGN_CACHE_DIR=/path/to/cache docker compose up -d gallery
#
# Build from source instead of pulling:
#   docker compose build

x-image: &image
  # The published image, so a fresh clone can `docker compose pull` and run
  # without building. `docker compose build` still rebuilds it locally from
  # the Dockerfile in this repo.
  #
  # `:latest` tracks the newest release — the publish workflow pushes it
  # alongside every version tag. Pin to a specific tag for a reproducible
  # deployment.
  image: ${DESIGNER_MCP_IMAGE:-ghcr.io/whit3rabbit/designer-mcp:latest}
  build:
    context: .

x-cache-env: &cache-env
  DESIGN_CACHE_DIR: /cache
  # The upstream package reads this name; both point at the same directory.
  REFERO_CACHE_DIR: /cache

# The cache is a NAMED volume by default, so Docker seeds it from the
# catalog baked into the image on first run. A named volume also keeps
# whatever the fetch services write between runs.
#
# Override with an absolute path to bind-mount a cache directory instead:
#   DESIGN_CACHE_DIR=/Users/you/.design-cache docker compose up -d gallery
# A bind mount SHADOWS the baked catalog, which is the point: it lets you
# point at a newer cache without rebuilding the image.
volumes:
  design-cache:
    name: ${DESIGN_CACHE_VOLUME:-design-cache}

services:
  gallery:
    <<: *image
    ports:
      # Host port is configurable so a second instance can run alongside:
      #   GALLERY_PORT=8788 docker compose up -d gallery
      - "127.0.0.1:${GALLERY_PORT:-8787}:8787"
    volumes:
      - design-cache:/cache:ro
    environment:
      <<: *cache-env
      PORT: "8787"
      HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Populate the cache from Refero's public pages. The image ships the
  # fetcher, so a fresh install needs no repo checkout:
  #   docker compose run --rm fetch
  # Reads only public pages; /api/ is never requested.
  #
  # `entrypoint` (not `command`) so trailing args append:
  #   docker compose run --rm fetch --limit 20
  fetch:
    <<: *image
    profiles: ["fetch"]
    volumes:
      - design-cache:/cache
    environment: *cache-env
    entrypoint: ["node", "scripts/refero-public-fetch.js"]
    init: true

  # Import OpenDesign design systems. Sparse-clones only the
  # `design-systems/` subtree (38 MB, not the 3.6 GB full repo).
  #
  # `entrypoint` (not `command`) so that trailing args APPEND rather than
  # replace it — `docker compose run --rm opendesign --source /path` works.
  opendesign:
    <<: *image
    profiles: ["fetch"]
    volumes:
      - design-cache:/cache
    environment: *cache-env
    entrypoint: ["node", "scripts/fetch-opendesign.mjs"]
    init: true

  # Cache every screenshot locally so the gallery needs no network.
  # ~150 MB for the full Refero catalog, or ~55 MB with --compress.
  #
  # `entrypoint` (not `command`) so trailing args append:
  #   docker compose run --rm thumbs --limit 20 --force
  #
  # --compress re-encodes to WebP before the bytes touch the disk, so a
  # fresh install never stores the full-size JPEGs. Drop it if you want
  # the originals.
  thumbs:
    <<: *image
    profiles: ["fetch"]
    volumes:
      - design-cache:/cache
    environment: *cache-env
    entrypoint: ["node", "scripts/fetch-thumbs.mjs", "--compress"]
    init: true

  # Re-encode an EXISTING thumbnail cache to WebP. Use this when the
  # thumbnails were fetched before the compressor existed:
  #   docker compose run --rm compress --replace
  #
  # Trailing args append:
  #   docker compose run --rm compress --width 720 --quality 80
  compress:
    <<: *image
    profiles: ["fetch"]
    volumes:
      - design-cache:/cache
    environment: *cache-env
    entrypoint: ["node", "scripts/compress-thumbs.mjs"]
    init: true

  # Fetch the GradientDeck AI component catalog. Each variant is published
  # as a shadcn registry JSON, so the source is real, complete TSX — not a
  # screenshot or a description of one.
  #
  #   docker compose run --rm components
  components:
    <<: *image
    profiles: ["fetch"]
    volumes:
      - design-cache:/cache
    environment: *cache-env
    entrypoint: ["node", "scripts/fetch-gradientdeck.mjs"]
    init: true

  # Fetch the GradientDeck preset catalogs: background gradients and
  # patterns, liquid glass effects and Tailwind colour scales.
  #
  #   docker compose run --rm presets
  presets:
    <<: *image
    profiles: ["fetch"]
    volumes:
      - design-cache:/cache
    environment: *cache-env
    entrypoint: ["node", "scripts/fetch-presets.mjs"]
    init: true

  # The upstream stdio MCP server (Refero-specific tools). Run it with
  # `docker compose run --rm mcp` — it speaks JSON-RPC over stdin/stdout,
  # so it is not started by `up`.
  mcp:
    <<: *image
    profiles: ["mcp"]
    volumes:
      - design-cache:/cache:ro
    environment:
      <<: *cache-env
      # The upstream package refetches the catalog over the network when its
      # cache goes stale. The image ships a baked catalog and must work with
      # no network at all, so the TTL is effectively disabled here. The
      # `refero_refresh` tool still refreshes on demand.
      REFERO_CACHE_TTL_MS: "315360000000"
    command: ["node", "scripts/mcp-entry.mjs"]
    # stdout is the MCP transport — diagnostics go to stderr.
    init: true

  # The generic stdio MCP server: `design_search`, `design_get`,
  # `design_list`, `design_facets`, `design_markdown` across both sources.
  design:
    <<: *image
    profiles: ["mcp"]
    volumes:
      - design-cache:/cache:ro
    environment: *cache-env
    command: ["node", "scripts/mcp-server.mjs"]
    init: true